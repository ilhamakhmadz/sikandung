<!DOCTYPE html>
<html lang="id" class="transition duration-300">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login SIKANDUNG</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">

<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            colors: {
                primary: '#208a8a',
                primary2: '#0db077'
            }
        }
    }
}
</script>

<style>
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
}
</style>

</head>

<body class="bg-gradient-to-br from-primary to-primary2 min-h-screen flex items-center justify-center dark:bg-slate-900 transition">

<!-- TOAST -->
<div id="toast" class="fixed top-5 right-5 bg-red-500 text-white px-6 py-3 rounded-xl shadow-lg hidden">
    Username atau password salah
</div>

<div class="w-full max-w-6xl rounded-3xl shadow-2xl overflow-hidden grid md:grid-cols-2">

    <!-- LEFT -->
    <div class="relative hidden md:block">
        <img src="C:\xampp\htdocs\sikandung\assets\images\sikandung-hero.png"
             class="absolute inset-0 w-full h-full object-cover">

        <div class="absolute inset-0 bg-gradient-to-br from-primary/80 to-primary2/70"></div>

        <div class="relative z-10 flex flex-col justify-center h-full p-10 text-white">
            <h1 class="text-4xl font-bold mb-3">SIKANDUNG</h1>
            <p class="opacity-90">
                Sistem Informasi Pendataan Perikanan Kabupaten Bandung
            </p>
        </div>
    </div>

    <!-- RIGHT -->
    <div class="bg-white dark:bg-slate-900 p-8 md:p-12 flex flex-col justify-center">

        <!-- DARK MODE BUTTON -->
        <div class="flex justify-end mb-4">
            <button onclick="toggleDark()" class="text-sm text-gray-500 dark:text-gray-300">
                🌙 Mode
            </button>
        </div>

        <div class="max-w-md mx-auto w-full">

            <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">
                Login Akun
            </h2>

            <p class="text-gray-500 mb-8 text-sm">
                Masuk untuk mengakses sistem
            </p>

            <form onsubmit="handleLogin(event)" class="space-y-5">

                <!-- Username -->
                <div>
                    <label class="text-sm font-semibold text-gray-600 dark:text-gray-300">Username</label>
                    <div class="flex items-center border rounded-xl px-3 py-2 mt-1 focus-within:ring-2 ring-primary">
                        <input type="text" id="username"
                            class="w-full outline-none text-sm bg-transparent"
                            placeholder="Masukkan username">
                    </div>
                </div>

                <!-- Password -->
                <div>
                    <label class="text-sm font-semibold text-gray-600 dark:text-gray-300">Password</label>
                    <div class="flex items-center border rounded-xl px-3 py-2 mt-1 focus-within:ring-2 ring-primary">
                        <input type="password" id="password"
                            class="w-full outline-none text-sm bg-transparent"
                            placeholder="Masukkan password">
                        <button type="button" onclick="togglePassword()">👁️</button>
                    </div>
                </div>

                <!-- Remember + Forgot -->
                <div class="flex justify-between items-center text-sm">
                    <label class="flex items-center gap-2 text-gray-600 dark:text-gray-300">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="text-primary hover:underline">
                        Lupa password?
                    </a>
                </div>

                <!-- Button -->
                <button id="loginBtn"
                    class="w-full bg-gradient-to-r from-primary to-primary2 text-white py-3 rounded-xl font-semibold shadow-lg transition flex items-center justify-center gap-2">
                    <span id="btnText">Login</span>
                    <span id="loading" class="hidden animate-spin">⏳</span>
                </button>

            </form>

            <p class="text-xs text-center text-gray-400 mt-8">
                © 2026 Diskominfo Kabupaten Bandung
            </p>

        </div>

    </div>

</div>

<script>
// SHOW PASSWORD
function togglePassword() {
    const input = document.getElementById("password");
    input.type = input.type === "password" ? "text" : "password";
}

// DARK MODE
function toggleDark() {
    document.documentElement.classList.toggle('dark');
}

// LOGIN SIMULATION
function handleLogin(e) {
    e.preventDefault();

    const btn = document.getElementById("loginBtn");
    const text = document.getElementById("btnText");
    const loading = document.getElementById("loading");

    text.innerText = "Loading...";
    loading.classList.remove("hidden");

    setTimeout(() => {
        loading.classList.add("hidden");
        text.innerText = "Login";

        showToast();
    }, 2000);
}

// TOAST
function showToast() {
    const toast = document.getElementById("toast");
    toast.classList.remove("hidden");

    setTimeout(() => {
        toast.classList.add("hidden");
    }, 3000);
}
</script>

</body>
</html>
